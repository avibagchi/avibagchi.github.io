<section id="news" class="section-after-header news-section" markdown="0">
<details class="news-collapsible">
<summary class="news-summary">News</summary>
<ul class="news-list">
{% for item in site.data.news %}
<li><strong>{{ item.date }}</strong> — {{ item.headline }}</li>
{% endfor %}
</ul>
</details>
</section>
